name: Refresh profile stats

on:
  schedule:
    # 05:40 UTC daily. Off the hour, because the hour is when every other cron fires.
    - cron: "40 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate the stats card
        env:
          # A PAT with repo, read:org and read:user. The built-in GITHUB_TOKEN cannot see
          # private repositories in other organisations, so without this the commit counts
          # silently collapse to public-only numbers.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/stats.mjs

      - name: Commit the card if the numbers moved
        run: |
          if [ -z "$(git status --porcelain assets/highlights.svg)" ]; then
            echo "No change in the numbers today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/highlights.svg
          git commit -m "chore: refresh profile stats"
          git push
